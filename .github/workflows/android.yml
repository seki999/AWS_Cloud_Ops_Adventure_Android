name: Android offline simulator
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install supported Android SDK packages
        uses: android-actions/setup-android@v4
        with:
          # Keep the Java-17-compatible command-line tools used by this AGP version.
          cmdline-tools-version: '12266719'
          # The obsolete 'tools' package is no longer distributed by Google.
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install jsonschema==4.23.0
      - name: Validate all 60 mission assets
        run: python tools/validate_content.py
      - run: chmod +x gradlew
      - name: Test, lint and build Debug APK
        run: ./gradlew --no-daemon :core:test testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v6
        with:
          name: cloud-ops-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
